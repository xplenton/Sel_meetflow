<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- MeetFlow Favicon — Iter 394
       Brand-Icon "Workflow" (Lucide-inspiriert): zwei abgerundete Boxen die
       per L-förmiger Linie verbunden sind. Symbolisiert "abstimmen →
       organisieren → zusammenarbeiten" und passt zur neuen All-in-One-
       Positionierung der App. -->
  <rect width="32" height="32" rx="8" fill="#4A5D4E"/>
  <!-- Top-left node -->
  <rect x="6" y="6" width="9" height="9" rx="2" fill="white" opacity="0.95"/>
  <!-- L-shape connector -->
  <path d="M10.5 17 V20 A2 2 0 0 0 12.5 22 H15"
        fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- Bottom-right node -->
  <rect x="17" y="17" width="9" height="9" rx="2" fill="white" opacity="0.95"/>
</svg>
