<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline - MeetFlow</title>
  <meta name="theme-color" content="#4A5D4E">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F9F9F8;
      color: #1C1F1D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border: 1px solid #E2E4E0;
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 4px 24px rgba(28, 31, 29, 0.04);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: #4A5D4E;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2rem;
    }
    h1 { font-size: 1.5rem; color: #4A5D4E; margin-bottom: 0.5rem; }
    p { color: #6B7280; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem; }
    button {
      background: #4A5D4E; color: #fff; border: 0;
      padding: 0.75rem 1.5rem; border-radius: 999px; font-size: 0.9rem;
      cursor: pointer; font-weight: 500;
    }
    button:hover { background: #3E4E42; }
    .hint { font-size: 0.75rem; color: #9CA3AF; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#9888;</div>
    <h1>Keine Verbindung</h1>
    <p>MeetFlow benoetigt eine aktive Internetverbindung. Bitte pruefe deine Verbindung und versuche es erneut.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
    <p class="hint">Deine Daten sind sicher - sobald du wieder online bist, geht es nahtlos weiter.</p>
  </div>
</body>
</html>
